name: AdjusterAssistBE CI/CD Pipeline

on:
  push:
    branches:
      - develop   # Development branch pushes
      - main      # Production branch pushes
    tags:
      - 'v*.*.*'  # Version tags (e.g. v1.8.3, v1.8.3-dev.0)

jobs:
  verify-and-test:
    name: Verify Code & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Entrypoint Syntax
        run: node --check src/server.js

      - name: Log Deployment Details
        run: |
          echo "🚀 Deploying Commit: ${{ github.sha }}"
          echo "🌿 Target Branch/Ref: ${{ github.ref }}"

  trigger-render-deploy:
    name: Trigger Render Deployment
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Send Deploy Signal to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"